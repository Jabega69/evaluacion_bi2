- name: Insert + cleanup keep_alive row
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          echo "::group::Keep-alive ping $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          echo "→ Insertando fila..."
          curl --fail-with-body --retry 3 --retry-delay 10 --silent --show-error \
            -X POST "${SUPABASE_URL}/rest/v1/keep_alive" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{}'
          echo ""

          echo "→ Limpiando filas antiguas..."
          CUTOFF=$(date -u -d '7 days ago' +'%Y-%m-%dT%H:%M:%SZ')
          curl --fail-with-body --retry 3 --retry-delay 10 --silent --show-error \
            -X DELETE "${SUPABASE_URL}/rest/v1/keep_alive?pinged_at=lt.${CUTOFF}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
          echo ""

          echo "✅ Keep-alive completado"
          echo "::endgroup::"
