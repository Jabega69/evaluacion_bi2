name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 */4 * *' # Cada 4 días
  workflow_dispatch: # Ejecución manual

jobs:
  ping_db:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "🔍 Verificando secrets..."

          if [ -z "$SUPABASE_URL" ]; then
            echo "❌ Error: SUPABASE_URL no está configurado"
            exit 1
          fi

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "❌ Error: SUPABASE_ANON_KEY no está configurado"
            exit 1
          fi

          # Eliminar trailing slash si existe
          CLEAN_URL="${SUPABASE_URL%/}"

          echo "🌐 Haciendo ping a Supabase..."

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            "$CLEAN_URL/rest/v1/" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")

          echo "📡 HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Supabase está activo y respondiendo correctamente"
          else
            echo "❌ Supabase respondió con status inesperado: $HTTP_STATUS"
            exit 1
          fi
