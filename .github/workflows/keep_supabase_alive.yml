name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 */4 * *'
  workflow_dispatch:

jobs:
  ping_db:
    runs-on: ubuntu-latest

    steps:
      - name: Debug secrets        # ← AÑADIDO
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "URL length: ${#SUPABASE_URL}"
          echo "KEY length: ${#SUPABASE_ANON_KEY}"
          echo "URL starts with: ${SUPABASE_URL:0:15}"

      - name: Ping Supabase        # ← EL QUE YA TENÍAS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          CLEAN_URL="${SUPABASE_URL%/}"
          echo "🌐 Haciendo ping a Supabase..."
          HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" \
            --max-time 15 \
            "$CLEAN_URL/rest/v1/evaluaciones?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Accept: application/json")
          echo "📡 HTTP status: $HTTP_STATUS"
          echo "📄 Respuesta: $(cat response.txt)"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Supabase activo"
          else
            echo "❌ Status inesperado: $HTTP_STATUS"
            exit 1
          fi
